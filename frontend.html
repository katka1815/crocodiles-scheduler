<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>🐊 Prague Crocodiles – Rozvrh</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f172a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      padding: 0 0 60px;
    }

    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-title {
      font-size: 18px;
      font-weight: 800;
      color: #f1f5f9;
    }

    .header-sub {
      font-size: 12px;
      color: #64748b;
      margin-top: 2px;
    }

    .header-day {
      font-size: 13px;
      color: #60a5fa;
      margin-top: 4px;
      font-weight: 600;
    }

    .controls {
      padding: 12px 16px 0;
    }

    .search-input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 15px;
      padding: 10px 14px;
      outline: none;
    }
    .search-input::placeholder { color: #475569; }
    .search-input:focus { border-color: #3b82f6; }

    /* ── Filter rows ── */
    .filter-section {
      padding: 10px 16px 0;
    }

    .filter-label {
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .filter-btn {
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 4px 14px;
      background: #1e293b;
      color: #94a3b8;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      height: 28px;
      display: flex;
      align-items: center;
    }
    .filter-btn:hover { border-color: #64748b; }
    .filter-btn.active {
      border-color: transparent;
      color: #0f172a;
      font-weight: 700;
    }

    /* Role filter colors */
    .role-btn-ref.active   { background: #fb923c; }
    .role-btn-srv.active   { background: #a78bfa; }
    .role-btn-all.active   { background: #3b82f6; color: #fff; }

    /* ── Match cards ── */
    .matches {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .match-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 12px;
    }

    .match-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 8px;
    }

    .match-time {
      color: #94a3b8;
      font-size: 13px;
      font-weight: 700;
    }

    /* Kontrastní odznak kurtu */
    .match-field-badge {
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .match-vs {
      color: #f1f5f9;
      font-size: 14px;
      font-weight: 600;
      flex: 1;
      min-width: 0;
    }

    .duty-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 5px;
    }

    .duty-badge {
      border-radius: 4px;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 800;
      color: #0f172a;
      white-space: nowrap;
      min-width: 82px;
      text-align: center;
    }

    .duty-names {
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.6;
    }

    /* Dimmed cards when role filter hides primary content */
    .match-card.dimmed {
      opacity: 0.35;
    }

    .highlight {
      background: #fde047;
      color: #0f172a;
      border-radius: 3px;
      padding: 0 2px;
    }

    .empty {
      color: #64748b;
      text-align: center;
      padding: 40px 16px;
      font-size: 15px;
    }

    .loading {
      color: #64748b;
      text-align: center;
      padding: 60px 16px;
      font-size: 15px;
    }

    .no-schedule {
      text-align: center;
      padding: 60px 16px;
    }
    .no-schedule .emoji { font-size: 48px; margin-bottom: 16px; }
    .no-schedule p { color: #64748b; font-size: 15px; }

    .updated {
      text-align: center;
      color: #334155;
      font-size: 11px;
      padding: 16px;
    }
  </style>
</head>
<body>

<header>
  <div class="header-title">🐊 Prague Crocodiles</div>
  <div class="header-sub">Rozvrh služeb</div>
  <div class="header-day" id="schedule-day"></div>
</header>

<div class="controls">
  <input class="search-input" id="search" type="search" placeholder="Hledat podle jména nebo času…" oninput="render()">
</div>

<!-- Filtr týmu -->
<div class="filter-section">
  <div class="filter-label">Tým</div>
  <div class="filter-row" id="team-filters"></div>
</div>

<!-- Filtr funkce -->
<div class="filter-section">
  <div class="filter-label">Funkce</div>
  <div class="filter-row" id="role-filters">
    <button class="filter-btn role-btn-all active" onclick="setRole(null, this)">Vše</button>
    <button class="filter-btn role-btn-ref" onclick="setRole('ref', this)">🟠 Rozhodčí</button>
    <button class="filter-btn role-btn-srv" onclick="setRole('srv', this)">🟣 Podávající</button>
  </div>
</div>

<div class="matches" id="matches">
  <div class="loading">Načítám rozvrh…</div>
</div>

<div class="updated" id="updated"></div>

<script>
  // ── Barvy týmů ──────────────────────────────────────────────────────────
  const TEAM_COLORS = {
    "Mix A": "#4ade80",
    "Mix B": "#60a5fa",
    "Muži":  "#f97316",
    "Ženy":  "#e879f9",
  };

  // ── Kontrastní barvy kurtů ───────────────────────────────────────────────
  const FIELD_COLORS = {
    "1": { bg: "#fbbf24", text: "#0f172a" },
    "2": { bg: "#38bdf8", text: "#0f172a" },
    "3": { bg: "#a78bfa", text: "#0f172a" },
    "4": { bg: "#fb923c", text: "#0f172a" },
    "5": { bg: "#34d399", text: "#0f172a" },
    "6": { bg: "#f472b6", text: "#0f172a" },
  };

  function fieldBadge(field) {
    if (!field) return "";
    // Extrahuj číslo z názvu kurtu (např. "Kurt 2" → "2", "Field 3" → "3")
    const match = String(field).match(/\d+/);
    const num = match ? match[0] : null;
    const colors = num && FIELD_COLORS[num] ? FIELD_COLORS[num] : { bg: "#334155", text: "#94a3b8" };
    return `<span class="match-field-badge" style="background:${colors.bg};color:${colors.text}">Kurt ${num || field}</span>`;
  }

  // ── Stav ────────────────────────────────────────────────────────────────
  let allMatches = [];
  let activeTeam = null;
  let activeRole = null;  // null | "ref" | "srv"
  let lastFetch = null;

  // ── Helpers ─────────────────────────────────────────────────────────────
  function teamColor(name) {
    for (const [key, color] of Object.entries(TEAM_COLORS)) {
      if (name && name.includes(key)) return color;
    }
    return "#94a3b8";
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function highlight(text, query) {
    if (!query) return escapeHtml(text);
    const escaped = escapeHtml(text);
    const escapedQ = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return escaped.replace(new RegExp(escapedQ, 'gi'), m => `<span class="highlight">${m}</span>`);
  }

  // ── Filtr funkce ─────────────────────────────────────────────────────────
  function setRole(role, btn) {
    activeRole = role;
    document.querySelectorAll("#role-filters .filter-btn").forEach(b => {
      b.classList.remove("active");
    });
    btn.classList.add("active");
    render();
  }

  // ── Filtr týmu ───────────────────────────────────────────────────────────
  function buildTeamFilters() {
    const teams = new Set();
    for (const m of allMatches) {
      for (const t of [m.home, m.away, m.ref_team, m.serving_team]) {
        for (const key of Object.keys(TEAM_COLORS)) {
          if (t && t.includes(key)) teams.add(key);
        }
      }
    }
    const order = ["Mix A", "Mix B", "Muži", "Ženy"];
    const active = order.filter(k => teams.has(k));
    const container = document.getElementById("team-filters");
    container.innerHTML = "";

    const allBtn = document.createElement("button");
    allBtn.className = "filter-btn" + (activeTeam === null ? " active" : "");
    allBtn.textContent = "Vše";
    if (activeTeam === null) { allBtn.style.background = "#3b82f6"; allBtn.style.color = "#fff"; }
    allBtn.onclick = () => { activeTeam = null; buildTeamFilters(); render(); };
    container.appendChild(allBtn);

    for (const team of active) {
      const btn = document.createElement("button");
      btn.className = "filter-btn" + (activeTeam === team ? " active" : "");
      btn.textContent = team;
      if (activeTeam === team) btn.style.background = TEAM_COLORS[team];
      btn.onclick = () => { activeTeam = team; buildTeamFilters(); render(); };
      container.appendChild(btn);
    }
  }

  // ── Render ───────────────────────────────────────────────────────────────
  function render() {
    const query = document.getElementById("search").value.trim().toLowerCase();
    const container = document.getElementById("matches");

    if (allMatches.length === 0) {
      container.innerHTML = `
        <div class="no-schedule">
          <div class="emoji">📋</div>
          <p>Rozvrh ještě nebyl vygenerován.<br>Počkej až ho Kateřina připraví 🐊</p>
        </div>`;
      return;
    }

    let filtered = allMatches;

    // Filtr týmu
    if (activeTeam) {
      filtered = filtered.filter(m =>
        [m.home, m.away, m.ref_team, m.serving_team].some(t => t && t.includes(activeTeam))
      );
    }

    // Filtr textu
    if (query) {
      filtered = filtered.filter(m =>
        m.st.includes(query) ||
        (m.home || "").toLowerCase().includes(query) ||
        (m.away || "").toLowerCase().includes(query) ||
        (m.referees || []).some(r => r.toLowerCase().includes(query)) ||
        (m.servers || []).some(s => s.toLowerCase().includes(query))
      );
    }

    if (filtered.length === 0) {
      container.innerHTML = `<div class="empty">Žádné zápasy neodpovídají filtru.</div>`;
      return;
    }

    container.innerHTML = filtered.map(m => {
      const refColor = teamColor(m.ref_team);
      const srvColor = teamColor(m.serving_team);

      // Dimming podle role filtru
      let dimmed = "";
      if (activeRole === "ref" && (!m.referees || m.referees.length === 0)) dimmed = " dimmed";
      if (activeRole === "srv" && (!m.servers || m.servers.length === 0)) dimmed = " dimmed";

      const refRow = m.referees && m.referees.length ? `
        <div class="duty-row">
          <span class="duty-badge" style="background:${refColor}">Rozhodčí</span>
          <span class="duty-names">${m.referees.map(n => highlight(n, query)).join(", ")}</span>
        </div>` : "";

      const srvRow = m.servers && m.servers.length ? `
        <div class="duty-row">
          <span class="duty-badge" style="background:${srvColor}">Podávající</span>
          <span class="duty-names">${m.servers.map(n => highlight(n, query)).join(", ")}</span>
        </div>` : "";

      return `
        <div class="match-card${dimmed}">
          <div class="match-head">
            <span class="match-time">${escapeHtml(m.st)}</span>
            ${fieldBadge(m.field)}
            <span class="match-vs">${highlight(m.home, query)} vs ${highlight(m.away, query)}</span>
          </div>
          ${refRow}${srvRow}
        </div>`;
    }).join("");
  }

  // ── Fetch ────────────────────────────────────────────────────────────────
  async function fetchSchedule() {
    try {
      const res = await fetch("/api/assignments");
      const data = await res.json();
      allMatches = data.assignments || [];
      lastFetch = new Date();

      const dayEl = document.getElementById("schedule-day");
      dayEl.textContent = data.schedule_label || "";

      const updEl = document.getElementById("updated");
      updEl.textContent = allMatches.length
        ? `Aktualizováno: ${lastFetch.toLocaleTimeString("cs-CZ")}`
        : "";

      buildTeamFilters();
      render();
    } catch (e) {
      document.getElementById("matches").innerHTML =
        `<div class="empty">Nepodařilo se načíst rozvrh. Zkus to za chvíli.</div>`;
    }
  }

  fetchSchedule();
  setInterval(fetchSchedule, 30000);
</script>
</body>
</html>
