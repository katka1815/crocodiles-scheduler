<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>🐊 Prague Crocodiles – Rozvrh</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f172a;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      padding: 0 0 60px;
    }

    header {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-title {
      font-size: 18px;
      font-weight: 800;
      color: #f1f5f9;
    }

    .header-sub {
      font-size: 12px;
      color: #64748b;
      margin-top: 2px;
    }

    .header-day {
      font-size: 13px;
      color: #60a5fa;
      margin-top: 4px;
      font-weight: 600;
    }

    .controls {
      padding: 12px 16px 0;
    }

    .search-input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 15px;
      padding: 10px 14px;
      outline: none;
    }
    .search-input::placeholder { color: #475569; }
    .search-input:focus { border-color: #3b82f6; }

    .team-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 16px 12px;
    }

    .team-btn {
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 4px 14px;
      background: #1e293b;
      color: #94a3b8;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .team-btn:hover { border-color: #64748b; }
    .team-btn.active {
      border-color: transparent;
      color: #0f172a;
      font-weight: 700;
    }

    .matches {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .match-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 12px;
    }

    .match-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 8px;
    }

    .match-time {
      color: #94a3b8;
      font-size: 13px;
      font-weight: 700;
    }

    .match-field {
      color: #475569;
      font-size: 12px;
    }

    .match-vs {
      color: #f1f5f9;
      font-size: 14px;
      font-weight: 600;
      flex: 1;
      min-width: 0;
    }

    .duty-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 5px;
    }

    .duty-badge {
      border-radius: 4px;
      padding: 3px 7px;
      font-size: 11px;
      font-weight: 800;
      color: #0f172a;
      white-space: nowrap;
      min-width: 82px;
      text-align: center;
    }

    .duty-names {
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1.6;
    }

    .highlight {
      background: #fde047;
      color: #0f172a;
      border-radius: 3px;
      padding: 0 2px;
    }

    .empty {
      color: #64748b;
      text-align: center;
      padding: 40px 16px;
      font-size: 15px;
    }

    .loading {
      color: #64748b;
      text-align: center;
      padding: 60px 16px;
      font-size: 15px;
    }

    .no-schedule {
      text-align: center;
      padding: 60px 16px;
    }
    .no-schedule .emoji { font-size: 48px; margin-bottom: 16px; }
    .no-schedule p { color: #64748b; font-size: 15px; }

    .updated {
      text-align: center;
      color: #334155;
      font-size: 11px;
      padding: 16px;
    }
  </style>
</head>
<body>

<header>
  <div class="header-title">🐊 Prague Crocodiles</div>
  <div class="header-sub">Rozvrh služeb</div>
  <div class="header-day" id="schedule-day"></div>
</header>

<div class="controls">
  <input class="search-input" id="search" type="search" placeholder="Hledat podle jména nebo času…" oninput="render()">
</div>

<div class="team-filters" id="team-filters"></div>

<div class="matches" id="matches">
  <div class="loading">Načítám rozvrh…</div>
</div>

<div class="updated" id="updated"></div>

<script>
  const TEAM_COLORS = {
    "Mix A": "#4ade80",
    "Mix B": "#60a5fa",
    "Muži": "#f97316",
    "Ženy": "#e879f9",
  };

  let allMatches = [];
  let activeTeam = null;
  let lastFetch = null;

  function teamColor(name) {
    for (const [key, color] of Object.entries(TEAM_COLORS)) {
      if (name && name.includes(key)) return color;
    }
    return "#94a3b8";
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function highlight(text, query) {
    if (!query) return escapeHtml(text);
    const escaped = escapeHtml(text);
    const escapedQ = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return escaped.replace(new RegExp(escapedQ, 'gi'), m => `<span class="highlight">${m}</span>`);
  }

  function buildTeamFilters() {
    const teams = new Set();
    for (const m of allMatches) {
      for (const t of [m.home, m.away, m.ref_team, m.serving_team]) {
        for (const key of Object.keys(TEAM_COLORS)) {
          if (t && t.includes(key)) teams.add(key);
        }
      }
    }
    const order = ["Mix A", "Mix B", "Muži", "Ženy"];
    const active = order.filter(k => teams.has(k));
    const container = document.getElementById("team-filters");
    container.innerHTML = "";

    const allBtn = document.createElement("button");
    allBtn.className = "team-btn" + (activeTeam === null ? " active" : "");
    allBtn.textContent = "Vše";
    if (activeTeam === null) allBtn.style.background = "#3b82f6";
    allBtn.onclick = () => { activeTeam = null; buildTeamFilters(); render(); };
    container.appendChild(allBtn);

    for (const team of active) {
      const btn = document.createElement("button");
      btn.className = "team-btn" + (activeTeam === team ? " active" : "");
      btn.textContent = team;
      if (activeTeam === team) btn.style.background = TEAM_COLORS[team];
      btn.onclick = () => { activeTeam = team; buildTeamFilters(); render(); };
      container.appendChild(btn);
    }
  }

  function render() {
    const query = document.getElementById("search").value.trim().toLowerCase();
    const container = document.getElementById("matches");

    if (allMatches.length === 0) {
      container.innerHTML = `
        <div class="no-schedule">
          <div class="emoji">📋</div>
          <p>Rozvrh ještě nebyl vygenerován.<br>Počkej až ho Kateřina připraví 🐊</p>
        </div>`;
      return;
    }

    let filtered = allMatches;

    if (activeTeam) {
      filtered = filtered.filter(m =>
        [m.home, m.away, m.ref_team, m.serving_team].some(t => t && t.includes(activeTeam))
      );
    }

    if (query) {
      filtered = filtered.filter(m =>
        m.st.includes(query) ||
        (m.home || "").toLowerCase().includes(query) ||
        (m.away || "").toLowerCase().includes(query) ||
        (m.referees || []).some(r => r.toLowerCase().includes(query)) ||
        (m.servers || []).some(s => s.toLowerCase().includes(query))
      );
    }

    if (filtered.length === 0) {
      container.innerHTML = `<div class="empty">Žádné zápasy neodpovídají filtru.</div>`;
      return;
    }

    container.innerHTML = filtered.map(m => {
      const refColor = teamColor(m.ref_team);
      const srvColor = teamColor(m.serving_team);

      const refRow = m.referees && m.referees.length ? `
        <div class="duty-row">
          <span class="duty-badge" style="background:${refColor}">Rozhodčí</span>
          <span class="duty-names">${m.referees.map(n => highlight(n, query)).join(", ")}</span>
        </div>` : "";

      const srvRow = m.servers && m.servers.length ? `
        <div class="duty-row">
          <span class="duty-badge" style="background:${srvColor}">Podávající</span>
          <span class="duty-names">${m.servers.map(n => highlight(n, query)).join(", ")}</span>
        </div>` : "";

      return `
        <div class="match-card">
          <div class="match-head">
            <span class="match-time">${escapeHtml(m.st)}</span>
            <span class="match-field">${escapeHtml(m.field || "")}</span>
            <span class="match-vs">${highlight(m.home, query)} vs ${highlight(m.away, query)}</span>
          </div>
          ${refRow}${srvRow}
        </div>`;
    }).join("");
  }

  async function fetchSchedule() {
    try {
      const res = await fetch("/api/assignments");
      const data = await res.json();
      allMatches = data.assignments || [];
      lastFetch = new Date();

      const dayEl = document.getElementById("schedule-day");
      dayEl.textContent = data.schedule_label || "";

      const updEl = document.getElementById("updated");
      updEl.textContent = allMatches.length
        ? `Aktualizováno: ${lastFetch.toLocaleTimeString("cs-CZ")}`
        : "";

      buildTeamFilters();
      render();
    } catch (e) {
      document.getElementById("matches").innerHTML =
        `<div class="empty">Nepodařilo se načíst rozvrh. Zkus to za chvíli.</div>`;
    }
  }

  // Načti hned a pak každých 30 sekund
  fetchSchedule();
  setInterval(fetchSchedule, 30000);
</script>
</body>
</html>
